name: Coverage

on:
  push:
    branches: [main]
  pull_request:

env:
  SDE_VERSION: sde-external-10.8.0-2026-03-15-lin
  RUSTFLAGS: -Ctarget-cpu=x86-64
  BSE_DATA_DIR: ${{ github.workspace }}/basis_set_exchange/basis_set_exchange/data

jobs:
  coverage:
    name: Coverage (${{ matrix.cpu_type }})

    # Pin Ubuntu 22.04 so CI uses OpenBLAS 0.3.20.
    # Newer OpenBLAS versions give slightly different seeded QMC trajectories.
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - cpu_type: scalar
            sde_cpu: nhm
          - cpu_type: avx2
            sde_cpu: hsw
          - cpu_type: avx512
            sde_cpu: spr

    env:
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenmpi-dev openmpi-bin libopenblas-dev liblapack-dev libhdf5-dev pkg-config

          # Ubuntu 22.04 provides OpenBLAS 0.3.20. Newer OpenBLAS versions
          # give slightly different seeded QMC trajectories.
          OPENBLAS_VERSION="$(dpkg-query -W -f='${Version}' libopenblas-dev)"
          echo "OpenBLAS version: ${OPENBLAS_VERSION}"
          test "${OPENBLAS_VERSION}" = "0.3.20+ds-1"

      - name: Install basis set data
        run: git clone https://github.com/MolSSI-BSE/basis_set_exchange.git basis_set_exchange && git -C basis_set_exchange checkout 4adaf1372c7101620ca1a9f3130be9ae97fb8f30

      - name: Cache Intel SDE
        id: cache-sde
        uses: actions/cache@v4
        with:
          path: intel-sde
          key: intel-${{ env.SDE_VERSION }}

      - name: Download Intel SDE
        if: steps.cache-sde.outputs.cache-hit != 'true'
        run: |
          wget -qO intel-sde.tar.xz "https://downloadmirror.intel.com/915934/${SDE_VERSION}.tar.xz"
          mkdir -p intel-sde
          tar xf intel-sde.tar.xz --strip-components=1 -C intel-sde
          rm intel-sde.tar.xz

      - name: Verify Intel SDE
        run: ./intel-sde/sde64 --version

      - name: Configure permissions for Intel SDE
        run: |
          echo 0 | sudo tee /proc/sys/kernel/yama/ptrace_scope
          cat /proc/sys/kernel/yama/ptrace_scope

      - name: Generate coverage
        env:
          OPENBLAS_NUM_THREADS: 1
          OPENBLAS_CORETYPE: CORE2
          BSE_DATA_DIR: ${{ env.BSE_DATA_DIR }}
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: ${{ github.workspace }}/intel-sde/sde64 -${{ matrix.sde_cpu }} -no-follow-child --
        run: ./scripts/test.sh cargo llvm-cov --locked --release -p noci-rs --no-default-features --target x86_64-unknown-linux-gnu --lcov --output-path lcov-${{ matrix.cpu_type }}.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov-${{ matrix.cpu_type }}.info
          flags: cpu-${{ matrix.cpu_type }}
          fail_ci_if_error: false
